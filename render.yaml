services:
  - type: web
    name: studio-triage
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_PIN
        value: "0000"
      - key: DATABASE_URL
        value: sqlite:///./data/little_desk.db
      - key: PROJECTS_ROOT
        value: /data/projects
    disk:
      name: little-desk-data
      mountPath: /data
      sizeGB: 1
