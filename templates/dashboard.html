<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - Sovereign Design Triage</title>
    
    <!-- Tailwind CSS (CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Google Fonts: Lora (Serif), Inter (Sans), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind Config for Field Journal Aesthetic -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            200: '#e7e5e4',
                            300: '#d6d3d1',
                            400: '#a8a29e',
                            500: '#78716c',
                            600: '#57534e',
                            700: '#44403c',
                            800: '#292524',
                            900: '#1c1917'
                        }
                    },
                    fontFamily: {
                        serif: ['Lora', 'Georgia', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar for subtle appearance */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f5f5f4;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 3px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
        
        /* Typewriter loading animation */
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }
        .loading-line {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #78716c;
            animation: typewriter 2s steps(40) infinite;
        }
        
        /* Ink bleed effect for transitions */
        .ink-transition {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-stone-50 text-stone-800 font-sans antialiased">
    
    <!-- Header -->
    <header class="border-b border-stone-300 bg-stone-100/50">
        <div class="max-w-[1800px] mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="font-serif text-2xl text-stone-800 tracking-wide">{{ app_name }}</h1>
            <div class="flex items-center gap-4 text-sm text-stone-600">
                <span class="font-mono">Sovereign Node</span>
                <button 
                    hx-get="/settings/pin-modal"
                    hx-target="#modal-container"
                    class="text-stone-600 hover:text-stone-800 ink-transition"
                >
                    Settings
                </button>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="h-[calc(100vh-65px)] overflow-hidden">
        {% if emails %}
            <div class="h-full overflow-y-auto scrollbar-thin">
                {% for email in emails %}
                    {% include "partials/_email_item.html" %}
                {% endfor %}
            </div>
        {% else %}
            <!-- Empty State -->
            <div class="h-full flex items-center justify-center">
                <div class="text-center max-w-md px-6">
                    <svg class="w-16 h-16 mx-auto text-stone-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <h2 class="font-serif text-xl text-stone-700 mb-2">All Caught Up</h2>
                    <p class="text-stone-500">No pending design revisions. New emails will appear here automatically.</p>
                    
                    <!-- Polling indicator -->
                    <div 
                        class="mt-8 text-xs text-stone-400 font-mono"
                        hx-get="/api/emails/count"
                        hx-trigger="every 30s"
                        hx-swap="none"
                    >
                        Polling for new emails...
                    </div>
                </div>
            </div>
        {% endif %}
    </main>
    
    <!-- Modal Container -->
    <div id="modal-container"></div>
    
    <!-- Base Modal Structure (hidden by default) -->
    <template id="modal-template">
        <div class="fixed inset-0 z-50 flex items-center justify-center">
            <div class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm" onclick="this.parentElement.remove()"></div>
            <div class="relative bg-stone-50 border border-stone-300 rounded-sm p-8 max-w-md w-full mx-4 shadow-lg">
                <!-- Modal content injected here -->
            </div>
        </div>
    </template>

</body>
</html>
